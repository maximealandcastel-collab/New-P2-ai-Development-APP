workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai

    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch signing files
        script: |
          set -e

          # 1. Reformat App Store Connect API key (.p8 files are PKCS8 — PRIVATE KEY header)
          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          if not body:
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content")
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = '-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("API key written")
          PYEOF

          # 2. Generate a fresh RSA cert key on this machine
          openssl genrsa -out /tmp/cert_key.pem 2048 2>/dev/null
          echo "Cert key generated"

          # 3. Revoke ALL existing Distribution certs via Apple REST API
          python3 - <<'PYEOF'
          import os, subprocess, base64, json, time, urllib.request, urllib.error, sys

          def b64url(data):
              if isinstance(data, str): data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          key_id   = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          issuer   = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          now      = int(time.time())
          hdr      = b64url(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"},separators=(',',':')))
          pay      = b64url(json.dumps({"iss":issuer,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"},separators=(',',':')))
          msg      = f"{hdr}.{pay}"

          r = subprocess.run(['openssl','dgst','-sha256','-sign','/tmp/api_key.pem'],
                             input=msg.encode(), capture_output=True)
          if r.returncode != 0:
              sys.exit(f"JWT sign failed: {r.stderr.decode()[:200]}")
          der = r.stdout

          def read_len(d, pos):
              l = d[pos]; pos += 1
              if l & 0x80:
                  n = l & 0x7f; l = int.from_bytes(d[pos:pos+n],'big'); pos += n
              return l, pos
          pos = 1
          _, pos = read_len(der, pos)
          assert der[pos] == 0x02; pos += 1
          rl, pos = read_len(der, pos)
          rv = der[pos:pos+rl]; pos += rl
          assert der[pos] == 0x02; pos += 1
          sl, pos = read_len(der, pos)
          sv = der[pos:pos+sl]
          def pad32(b):
              b = b.lstrip(b'\x00')
              return (b'\x00' * (32 - len(b))) + b
          sig = b64url(pad32(rv) + pad32(sv))
          jwt = f"{msg}.{sig}"

          BASE = "https://api.appstoreconnect.apple.com/v1"
          headers = {"Authorization": f"Bearer {jwt}", "Content-Type": "application/json"}

          def api(method, path, body=None):
              url = BASE + path
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()) if r.status not in (204,) else {}
              except urllib.error.HTTPError as e:
                  return {"_error": e.code, "_body": e.read().decode()[:300]}

          # Fetch ALL certs — Apple uses "DISTRIBUTION" not "IOS_DISTRIBUTION"
          certs = api("GET", "/certificates?limit=200")
          dist = [c for c in certs.get("data",[]) if "DISTRIBUTION" in c.get("attributes",{}).get("certificateType","")]
          print(f"Found {len(dist)} Distribution cert(s) — revoking all")
          for c in dist:
              r = api("DELETE", f"/certificates/{c['id']}")
              print(f"  Revoked {c['id']}: {r}")
          print("Done revoking")
          PYEOF

          # 4. Fetch (or create) signing files
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create \
            --verbose

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd packages/anam_flutter_sdk && flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" \
            -not -path "./packages/anam_flutter_sdk/example/*" \
            -not -path "./packages/anam_flutter_sdk/macos/*" \
            -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
          flutter build ipa --release --build-name=2.0.1 --build-number=46

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
