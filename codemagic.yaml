workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.p2pfittech.ai
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: stabilization
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
          # Build 3077 is the last manually assigned release. Adding the
          # workflow counter guarantees a unique, increasing TestFlight build.
          IOS_BUILD_NUMBER=$((3077 + BUILD_NUMBER))
          echo "Building release 4.11.0 ($IOS_BUILD_NUMBER)"
          flutter build ipa --release \
            --build-name=4.11.0 \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=BUILD_NUMBER="$IOS_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

