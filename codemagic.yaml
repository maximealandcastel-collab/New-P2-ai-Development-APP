workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai

    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch signing files
        script: |
          set -e

          # 1. Reformat App Store Connect API key (.p8 files are PKCS8 — PRIVATE KEY header)
          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          if not body:
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content")
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = '-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("API key written")
          PYEOF

          # 2. Generate a fresh RSA cert key on this machine (avoids cross-platform issues)
          openssl genrsa -out /tmp/cert_key.pem 2048 2>/dev/null
          echo "Cert key generated"

          # 3. Revoke ALL existing Distribution certs via Apple REST API directly
          #    (bypasses Codemagic CLI type-filter bugs)
          python3 - <<'PYEOF'
          import os, subprocess, base64, json, time, urllib.request, urllib.error, sys

          def b64url(data):
              if isinstance(data, str): data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          key_id   = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          issuer   = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          now      = int(time.time())
          hdr      = b64url(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"},separators=(',',':')))
          pay      = b64url(json.dumps({"iss":issuer,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"},separators=(',',':')))
          msg      = f"{hdr}.{pay}"

          # Sign with openssl — produces DER-encoded ECDSA signature
          r = subprocess.run(['openssl','dgst','-sha256','-sign','/tmp/api_key.pem'],
                             input=msg.encode(), capture_output=True)
          if r.returncode != 0:
              sys.exit(f"JWT sign failed: {r.stderr.decode()[:200]}")
          der = r.stdout

          # Parse DER SEQUENCE { INTEGER r, INTEGER s } → raw 64-byte R||S
          def read_len(d, pos):
              l = d[pos]; pos += 1
              if l & 0x80:
                  n = l & 0x7f; l = int.from_bytes(d[pos:pos+n],'big'); pos += n
              return l, pos
          pos = 1
          _, pos = read_len(der, pos)          # SEQUENCE length
          assert der[pos] == 0x02; pos += 1
          rl, pos = read_len(der, pos)
          rv = der[pos:pos+rl]; pos += rl
          assert der[pos] == 0x02; pos += 1
          sl, pos = read_len(der, pos)
          sv = der[pos:pos+sl]
          rv = rv.lstrip(b'\x00').rjust(32, b'\x00')
          sv = sv.lstrip(b'\x00').rjust(32, b'\x00')
          jwt = f"{msg}.{b64url(rv+sv)}"
          print("JWT ok")

          # List ALL certificates, filter distribution types locally
          url = 'https://api.appstoreconnect.apple.com/v1/certificates?limit=200'
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {jwt}'})
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              certs = json.loads(resp.read()).get('data', [])
          except urllib.error.HTTPError as e:
              print(f"List certs HTTP {e.code}: {e.read().decode()[:200]}")
              certs = []

          print(f"Found {len(certs)} Distribution cert(s)")
          for cert in certs:
              cid   = cert['id']
              ctype = cert['attributes']['certificateType']
              print(f"  Deleting {cid} ({ctype})")
              dreq = urllib.request.Request(
                  f'https://api.appstoreconnect.apple.com/v1/certificates/{cid}',
                  method='DELETE',
                  headers={'Authorization': f'Bearer {jwt}'}
              )
              try:
                  urllib.request.urlopen(dreq, timeout=30)
                  print(f"  Deleted ok")
              except urllib.error.HTTPError as e:
                  print(f"  Delete failed {e.code}: {e.read().decode()[:100]}")

          if certs:
              print("Waiting 8s for Apple API to propagate…")
              time.sleep(8)
          PYEOF

          # 4. Fetch (or create) signing cert + provisioning profile
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create \
            --verbose

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
          flutter build ipa --release --build-name=2.9.0 --build-number=180 --dart-define=API_BASE_URL=https://p2pfitechai.com/api/v1 --dart-define=API_ORIGIN=https://p2pfitechai.com --dart-define=SOCKET_URL=https://p2pfitechai.com --dart-define=PREFILL_EMAIL=pmoney78q@gmail.com --dart-define=PREFILL_PASSWORD=Godisgood123

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
