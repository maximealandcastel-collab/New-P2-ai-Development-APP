workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai
        API_ORIGIN: https://p2pfitechai.com
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: stabilization
          include: true
          source: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $HOME/.p2p-signing

    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Create signing files automatically
        script: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          if not body:
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content")
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = '-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("App Store Connect API key prepared")
          PYEOF

          SIGNING_DIR="$HOME/.p2p-signing"
          CERTIFICATE_KEY="$SIGNING_DIR/distribution_private_key.pem"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          if [ -s "$CERTIFICATE_KEY" ]; then
            echo "Reusing stable Apple Distribution private key"
          else
            echo "Creating stable Apple Distribution private key"
            openssl genrsa -out "$CERTIFICATE_KEY" 2048 2>/dev/null
          fi
          chmod 600 "$CERTIFICATE_KEY"

          fetch_signing_files() {
            app-store-connect fetch-signing-files \
              "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key "@file:$CERTIFICATE_KEY" \
              --private-key @file:/tmp/api_key.pem \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --create \
              --verbose
          }

          set +e
          SIGNING_OUTPUT="$(fetch_signing_files 2>&1)"
          SIGNING_STATUS=$?
          set -e
          printf '%s\n' "$SIGNING_OUTPUT"

          if [ "$SIGNING_STATUS" -ne 0 ]; then
            if ! printf '%s' "$SIGNING_OUTPUT" | grep -Eq \
              "POST https://api\\.appstoreconnect\\.apple\\.com/v1/certificates returned 409:" \
              || ! printf '%s' "$SIGNING_OUTPUT" | grep -Fq \
              "You already have a current Distribution certificate or a pending certificate request"; then
              exit "$SIGNING_STATUS"
            fi

            echo "Apple certificate limit reached; replacing exactly one oldest distribution certificate"
            app-store-connect certificates list \
              --type DISTRIBUTION IOS_DISTRIBUTION \
              --json \
              --private-key @file:/tmp/api_key.pem \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --silent > /tmp/distribution_certificates.json

            CERTIFICATE_ID="$(python3 - <<'PYEOF'
          import datetime as dt
          import json
          import sys

          with open('/tmp/distribution_certificates.json') as source:
              payload = json.load(source)

          found = {}

          def visit(value):
              if isinstance(value, list):
                  for item in value:
                      visit(item)
                  return
              if not isinstance(value, dict):
                  return

              attributes = value.get('attributes')
              merged = dict(attributes) if isinstance(attributes, dict) else {}
              merged.update(value)

              resource_id = (
                  merged.get('id')
                  or merged.get('resourceId')
                  or merged.get('resource_id')
              )
              certificate_type = (
                  merged.get('certificateType')
                  or merged.get('certificate_type')
                  or merged.get('type')
              )
              expiration = (
                  merged.get('expirationDate')
                  or merged.get('expiration_date')
                  or merged.get('expiresAt')
                  or ''
              )

              if (
                  resource_id
                  and certificate_type in {'DISTRIBUTION', 'IOS_DISTRIBUTION'}
              ):
                  found[str(resource_id)] = str(expiration)

              for child in value.values():
                  visit(child)

          visit(payload)
          if not found:
              sys.exit('ERROR: Could not identify a distribution certificate to replace')

          def expiration_key(item):
              value = item[1]
              try:
                  parsed = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
                  return (0, parsed.timestamp())
              except (TypeError, ValueError):
                  return (1, value)

          selected_id, _ = min(found.items(), key=expiration_key)
          print(selected_id)
          PYEOF
            )"

            if [ -z "$CERTIFICATE_ID" ]; then
              echo "ERROR: No targeted distribution certificate selected"
              exit 1
            fi

            app-store-connect certificates delete "$CERTIFICATE_ID" \
              --private-key @file:/tmp/api_key.pem \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID"

            echo "One stale distribution certificate replaced; waiting for Apple to update"
            sleep 15
            fetch_signing_files
          fi

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
          # Build 3077 is the last manually assigned release. Adding the
          # workflow counter guarantees a unique, increasing TestFlight build.
          IOS_BUILD_NUMBER=3478
          echo "Building release 4.11.0 ($IOS_BUILD_NUMBER)"
          python3 scripts/verify_release_config.py --origin "$API_ORIGIN" --build "$IOS_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=4.11.0 \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=BUILD_NUMBER="$IOS_BUILD_NUMBER" \
            --dart-define=API_ORIGIN="$API_ORIGIN" \
            --dart-define=GIT_COMMIT="$(git rev-parse HEAD)"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/release-manifest.json
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

