# Codemagic CI/CD — P2P Fit Tech AI (pler_to_pler_app)
#
# iOS TestFlight uses: bash scripts/codemagic_ios_build.sh  (Shorebird release)
#
# Before first yaml build in Codemagic UI:
# 1. Shorebird Console → Account → API Tokens → create token
# 2. Codemagic → Teams → Global variables and secrets:
#      Group: shorebird
#      Variable: SHOREBIRD_TOKEN (Secure)
# 3. Start build → pick workflow: "iOS TestFlight (Shorebird)"
# 4. App Store Connect integration name must match app_store_connect below
# 5. iOS signing: App Store cert + profile for com.p2pfittech.ai
# 6. Keep Codemagic "Increment build number" OFF — script handles it via App Store Connect
definitions:
  env_versions: &env_versions
    flutter: 3.41.4
    xcode: latest
    cocoapods: default
  app_vars: &app_vars
    APP_ID: com.p2pfittech.ai
    PACKAGE_NAME: com.p2pfittech.ai
    APP_STORE_APPLE_ID: 6757503524
    FLUTTER_VERSION: 3.41.4
  scripts:
    - &disable_spm_and_install
      name: Install Flutter dependencies
      script: |
        set -e
        flutter config --no-enable-swift-package-manager
        flutter pub get
        cd packages/anam_flutter_sdk && flutter pub get
    - &analyze_project
      name: Analyze project
      script: |
        set -e
        flutter analyze
        cd packages/anam_flutter_sdk && flutter analyze
    - &run_tests
      name: Run tests
      script: |
        set -e
        flutter test
    - &install_pods
      name: Install CocoaPods
      script: |
        set -e
        find . -name "Podfile" -not -path "./packages/anam_flutter_sdk/example/*" -execdir pod install \;
    - &install_shorebird
      name: Install Shorebird
      script: |
        set -e
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        export PATH="$HOME/.shorebird/bin:$PATH"
        shorebird --version
    - &build_ios_ipa
      name: Shorebird Release (TestFlight IPA)
      script: |
        set -e
        bash scripts/codemagic_ios_build.sh
workflows:
  flutter-ci:
    name: Flutter CI
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      <<: *env_versions
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - *disable_spm_and_install
      - *analyze_project
      - *run_tests
  ios-testflight:
    name: iOS TestFlight (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      <<: *env_versions
      groups:
        - shorebird
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.p2pfittech.ai
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *install_shorebird
      - *disable_spm_and_install
      - *analyze_project
      - *run_tests
      - *install_pods
      - *build_ios_ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env_versions
      android_signing:
        - keystore_reference
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *disable_spm_and_install
      - *analyze_project
      - *run_tests
      - name: Build Android App Bundle
        script: |
          set -e
          flutter build appbundle \
            --release \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - flutter_drive.log

  ios-release-simple:
    name: iOS Release → TestFlight (Simple)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      vars:
        APP_ID: com.p2pfittech.ai
        BUNDLE_ID: com.p2pfittech.ai
    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize
      - name: Fetch or create signing certificate and profile
        script: |
          set -e
          # EC key required for Apple Distribution certificates
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/cert_key.pem
          # Uses integrations.app_store_connect for auth automatically
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create \
            --verbose
      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates
      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Install dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd packages/anam_flutter_sdk && flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/anam_flutter_sdk/example/*" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          set -e
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
