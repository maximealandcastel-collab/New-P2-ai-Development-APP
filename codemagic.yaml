workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      # Pinned, not `stable`: an upstream Flutter release should never silently
      # change what this workflow produces.
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      groups:
        - appstore
        # Must supply ADMIN_KEY. The client previously fell back to a hardcoded
        # default compiled into the binary.
      vars:
        BUNDLE_ID: com.p2pfittech.ai

    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch signing files
        script: |
          set -e

          # 1. Reformat App Store Connect API key (.p8 files are PKCS8 — PRIVATE KEY header)
          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          if not body:
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content")
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = '-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("API key written")
          PYEOF

          # 2. Generate a fresh RSA cert key on this machine (avoids cross-platform issues)
          openssl genrsa -out /tmp/cert_key.pem 2048 2>/dev/null
          echo "Cert key generated"

          # NOTE: a block here used to DELETE every Distribution certificate on
          # the Apple account before each build. That is account-wide and
          # irreversible — it breaks every other pipeline, every other machine,
          # and any teammate's local signing. fetch-signing-files --create below
          # reuses an existing certificate or creates one when genuinely absent,
          # which is all this workflow ever needed.

          # 3. Fetch (or create) signing cert + provisioning profile
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create \
            --verbose

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
          rm -rf ~/Library/Developer/Xcode/DerivedData
          flutter clean
          # --build-name is intentionally absent so the version comes from
          # pubspec.yaml. It used to be pinned to 3.2 while the source said
          # 2.7.0, making TestFlight builds impossible to trace to a commit.
          #
          # PREFILL_EMAIL / PREFILL_PASSWORD were removed: they baked the
          # owner's real credentials into every shipped IPA and pre-filled them
          # on the login screen. That password must be rotated.
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 1000)) \
            --dart-define=BUILD_NUMBER=$((BUILD_NUMBER + 1000)) \
            --dart-define=API_BASE_URL=https://p2pfitechai.com/api/v1 \
            --dart-define=API_ORIGIN=https://p2pfitechai.com \
            --dart-define=SOCKET_URL=https://p2pfitechai.com \
            --dart-define=ADMIN_KEY=$ADMIN_KEY

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
