# Codemagic CI/CD — P2P Fit Tech AI (pler_to_pler_app)
#
# iOS TestFlight uses: bash scripts/codemagic_ios_build.sh  (Shorebird release)
#
# Before first yaml build in Codemagic UI:
# 1. Shorebird Console → Account → API Tokens → create token
# 2. Codemagic → Teams → Global variables and secrets:
#      Group: shorebird
#      Variable: SHOREBIRD_TOKEN (Secure)
# 3. Start build → pick workflow: "iOS TestFlight (Shorebird)"
# 4. App Store Connect integration name must match app_store_connect below
# 5. iOS signing: App Store cert + profile for com.p2pfittech.ai
# 6. Keep Codemagic "Increment build number" OFF — script handles it via App Store Connect
definitions:
  env_versions: &env_versions
    flutter: 3.41.4
    xcode: latest
    cocoapods: default
  app_vars: &app_vars
    APP_ID: com.p2pfittech.ai
    PACKAGE_NAME: com.p2pfittech.ai
    APP_STORE_APPLE_ID: 6757503524
    FLUTTER_VERSION: 3.41.4
  scripts:
    - &disable_spm_and_install
      name: Install Flutter dependencies
      script: |
        set -e
        flutter config --no-enable-swift-package-manager
        flutter pub get
        cd packages/anam_flutter_sdk && flutter pub get
    - &analyze_project
      name: Analyze project
      script: |
        set -e
        flutter analyze
        cd packages/anam_flutter_sdk && flutter analyze
    - &run_tests
      name: Run tests
      script: |
        set -e
        flutter test
    - &install_pods
      name: Install CocoaPods
      script: |
        set -e
        find . -name "Podfile" -not -path "./packages/anam_flutter_sdk/example/*" -execdir pod install \;
    - &install_shorebird
      name: Install Shorebird
      script: |
        set -e
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        export PATH="$HOME/.shorebird/bin:$PATH"
        shorebird --version
    - &build_ios_ipa
      name: Shorebird Release (TestFlight IPA)
      script: |
        set -e
        bash scripts/codemagic_ios_build.sh
workflows:
  flutter-ci:
    name: Flutter CI
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      <<: *env_versions
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - *disable_spm_and_install
      - *analyze_project
      - *run_tests
  ios-testflight:
    name: iOS TestFlight (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      <<: *env_versions
      groups:
        - shorebird
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.p2pfittech.ai
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *install_shorebird
      - *disable_spm_and_install
      - *analyze_project
      - *run_tests
      - *install_pods
      - *build_ios_ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env_versions
      android_signing:
        - keystore_reference
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *disable_spm_and_install
      - *analyze_project
      - *run_tests
      - name: Build Android App Bundle
        script: |
          set -e
          flutter build appbundle \
            --release \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - flutter_drive.log

  ios-release-simple:
    name: iOS Release → TestFlight (Simple)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      groups:
        - app_store
      # ios_signing block intentionally removed — it triggers an automatic
      # "Fetch signing files" step that fails when APP_STORE_CONNECT_PRIVATE_KEY
      # has collapsed PEM newlines (which Codemagic env vars always produce).
      # Signing is handled manually in the script below instead.
      vars:
        APP_ID: com.p2pfittech.ai
    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch signing files
        script: |
          set -e
          # Reformat APP_STORE_CONNECT_PRIVATE_KEY — Codemagic env vars collapse
          # PEM newlines into one line; OpenSSL requires 64-char-wrapped base64.
          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty — check app_store env group")
          hdr = re.search(r'(-----BEGIN [^-]+-----)', raw)
          ftr = re.search(r'(-----END [^-]+-----)', raw)
          if not hdr or not ftr:
              sys.exit("ERROR: no PEM header/footer found in APP_STORE_CONNECT_PRIVATE_KEY")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = hdr.group(1) + '\n' + folded + '\n' + ftr.group(1) + '\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("API key written — lines:", len(pem.splitlines()))
          PYEOF

          # Generate RSA 2048 key for the distribution certificate.
          # Must be RSA: app-store-connect converts it to PKCS1 internally,
          # and PKCS1 is RSA-only — EC keys produce "cert key file is empty".
          openssl genrsa -out /tmp/cert_key.pem 2048
          openssl rsa -in /tmp/cert_key.pem -check -noout

          app-store-connect fetch-signing-files \
            "$APP_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create \
            --verbose

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates
      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Install dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd packages/anam_flutter_sdk && flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/anam_flutter_sdk/example/*" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          set -e
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
