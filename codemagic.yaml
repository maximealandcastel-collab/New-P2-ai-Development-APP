workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai

    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch signing files
        script: |
          set -e

          # 1. Reformat App Store Connect API key (.p8 files are PKCS8 — PRIVATE KEY header)
          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          if not body:
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content")
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = '-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("API key written")
          PYEOF

          # 2. Generate a fresh RSA cert key on this machine
          openssl genrsa -out /tmp/cert_key.pem 2048 2>/dev/null
          echo "Cert key generated"

          # 3. Fetch (or create) signing files — no cert revocation needed.
          #    --create: creates a new Distribution cert only when none exists.
          #    Codemagic keeps the cert across builds; Apple limit = 2 active certs.
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create \
            --verbose

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Inject GoogleService-Info.plist
        script: |
          set -e
          # GOOGLE_SERVICE_INFO_PLIST must be set in Codemagic → Environment variables
          # as a "File" variable pointing to your GoogleService-Info.plist contents.
          # Codemagic writes file variables to /tmp; copy to the iOS Runner folder.
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            cp "$GOOGLE_SERVICE_INFO_PLIST" ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected ✅"
          else
            echo "WARNING: GOOGLE_SERVICE_INFO_PLIST not set — push notifications will not work"
          fi

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd packages/anam_flutter_sdk && flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" \
            -not -path "./packages/anam_flutter_sdk/example/*" \
            -not -path "./packages/anam_flutter_sdk/macos/*" \
            -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
