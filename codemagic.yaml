workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai

    scripts:
      - name: Fetch or create App Store signing files
        script: |
          set -e
          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit('ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty')
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n', '').replace('\r', '').replace(' ', '').strip()
          if not body:
              sys.exit('ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content')
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          with open('/tmp/api_key.pem', 'w') as handle:
              handle.write('-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n')
          PYEOF
          # Create a fresh key, revoke only existing distribution certificates,
          # then let Codemagic create the replacement certificate and profile.
          openssl genrsa -out /tmp/cert_key.pem 2048 2>/dev/null
          echo "Fresh distribution certificate key generated"

          python3 - <<'PYEOF'
          import os, subprocess, base64, json, time, urllib.request, urllib.error, sys

          def b64url(data):
              if isinstance(data, str):
                  data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          key_id = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          issuer = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          now = int(time.time())
          header = b64url(json.dumps({'alg':'ES256','kid':key_id,'typ':'JWT'}, separators=(',',':')))
          payload = b64url(json.dumps({'iss':issuer,'iat':now,'exp':now+1200,'aud':'appstoreconnect-v1'}, separators=(',',':')))
          message = f'{header}.{payload}'
          signed = subprocess.run(
              ['openssl','dgst','-sha256','-sign','/tmp/api_key.pem'],
              input=message.encode(), capture_output=True
          )
          if signed.returncode != 0:
              sys.exit('JWT signing failed: ' + signed.stderr.decode()[:200])
          der = signed.stdout

          def read_len(data, pos):
              length = data[pos]
              pos += 1
              if length & 0x80:
                  count = length & 0x7f
                  length = int.from_bytes(data[pos:pos+count], 'big')
                  pos += count
              return length, pos

          pos = 1
          _, pos = read_len(der, pos)
          if der[pos] != 0x02:
              sys.exit('Unexpected ECDSA signature format')
          pos += 1
          rlen, pos = read_len(der, pos)
          rvalue = der[pos:pos+rlen]
          pos += rlen
          if der[pos] != 0x02:
              sys.exit('Unexpected ECDSA signature format')
          pos += 1
          slen, pos = read_len(der, pos)
          svalue = der[pos:pos+slen]
          rvalue = rvalue.lstrip(b'\x00').rjust(32, b'\x00')
          svalue = svalue.lstrip(b'\x00').rjust(32, b'\x00')
          token = f'{message}.{b64url(rvalue+svalue)}'
          headers = {'Authorization': f'Bearer {token}'}

          try:
              request = urllib.request.Request(
                  'https://api.appstoreconnect.apple.com/v1/certificates?limit=200',
                  headers=headers
              )
              response = urllib.request.urlopen(request, timeout=30)
              certificates = json.loads(response.read()).get('data', [])
          except urllib.error.HTTPError as error:
              sys.exit(f'Unable to list certificates ({error.code}): ' + error.read().decode()[:200])

          distribution_types = {'DISTRIBUTION', 'IOS_DISTRIBUTION'}
          targets = [
              certificate for certificate in certificates
              if certificate.get('attributes', {}).get('certificateType') in distribution_types
          ]
          print(f'Found {len(targets)} distribution certificate(s) to revoke')
          failures = []
          for certificate in targets:
              certificate_id = certificate['id']
              certificate_type = certificate['attributes']['certificateType']
              delete_request = urllib.request.Request(
                  f'https://api.appstoreconnect.apple.com/v1/certificates/{certificate_id}',
                  method='DELETE', headers=headers
              )
              try:
                  urllib.request.urlopen(delete_request, timeout=30)
                  print(f'Revoked {certificate_type} certificate {certificate_id}')
              except urllib.error.HTTPError as error:
                  failures.append(f'{certificate_id}: HTTP {error.code} ' + error.read().decode()[:200])

          if failures:
              sys.exit('Certificate revocation failed: ' + '; '.join(failures))
          if targets:
              print('Waiting for Apple certificate state to propagate')
              time.sleep(12)
          PYEOF

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create

      - name: Set up Xcode code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
            # Release 4.11.0 / build 3047. Apple already has earlier builds,
            # so every new upload must use a higher build number.
          flutter build ipa --release \
            --build-name=4.11 \
             --build-number=3054 \
             --dart-define=BUILD_NUMBER=3054

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

