workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai

    scripts:
      - name: Fetch App Store signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up Xcode code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -e
            # Release 4.11.0 / build 3036. Apple already has earlier builds,
            # so every new upload must use a higher build number.
          flutter build ipa --release \
            --build-name=4.11 \
             --build-number=3036 \
             --dart-define=BUILD_NUMBER=3036

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

triggering:
  events:
    - push
  branch_patterns:
    - pattern: stabilization
      include: true
      source: true
  cancel_previous_builds: true
