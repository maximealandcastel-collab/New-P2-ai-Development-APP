workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.p2pfittech.ai
        API_ORIGIN: https://p2pfitechai.com
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: elijah-stabilization
          include: true
          source: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $HOME/.p2p-signing

    scripts:
      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Create signing files automatically
        script: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import os, re, sys
          raw = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          if not raw.strip():
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty")
          body = re.sub(r'-----[^-]+-----', '', raw).replace('\n','').replace('\r','').replace(' ','').strip()
          if not body:
              sys.exit("ERROR: APP_STORE_CONNECT_PRIVATE_KEY has no content")
          folded = '\n'.join(body[i:i+64] for i in range(0, len(body), 64))
          pem = '-----BEGIN PRIVATE KEY-----\n' + folded + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/api_key.pem', 'w') as f:
              f.write(pem)
          print("App Store Connect API key prepared")
          PYEOF

          SIGNING_DIR="$HOME/.p2p-signing"
          CERTIFICATE_KEY="$SIGNING_DIR/distribution_private_key.pem"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          if [ -s "$CERTIFICATE_KEY" ]; then
            echo "Reusing stable Apple Distribution private key"
          else
            echo "Creating stable Apple Distribution private key"
            openssl genrsa -out "$CERTIFICATE_KEY" 2048 2>/dev/null
          fi
          chmod 600 "$CERTIFICATE_KEY"

          ASC_AUTH_ARGS=(
            --private-key @file:/tmp/api_key.pem
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER"
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID"
          )

          echo "Checking Apple App ID capabilities for $BUNDLE_ID"
          app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json \
            --silent \
            "${ASC_AUTH_ARGS[@]}" > /tmp/p2p_bundle_ids.json

          BUNDLE_RESOURCE_ID="$(python3 - "$BUNDLE_ID" <<'PYEOF'
          import json
          import sys

          wanted_identifier = sys.argv[1]
          with open('/tmp/p2p_bundle_ids.json') as source:
              payload = json.load(source)

          matches = {}

          def visit(value):
              if isinstance(value, list):
                  for item in value:
                      visit(item)
                  return
              if not isinstance(value, dict):
                  return

              attributes = value.get('attributes')
              merged = dict(attributes) if isinstance(attributes, dict) else {}
              merged.update(value)

              identifier = merged.get('identifier')
              resource_id = (
                  merged.get('id')
                  or merged.get('resourceId')
                  or merged.get('resource_id')
              )
              if identifier == wanted_identifier and resource_id:
                  matches[str(resource_id)] = identifier

              for child in value.values():
                  visit(child)

          visit(payload)
          if len(matches) != 1:
              sys.exit(
                  f'ERROR: Expected one Apple Bundle ID for {wanted_identifier}, '
                  f'found {len(matches)}'
              )
          print(next(iter(matches)))
          PYEOF
          )"

          app-store-connect bundle-ids capabilities "$BUNDLE_RESOURCE_ID" \
            --json \
            --silent \
            "${ASC_AUTH_ARGS[@]}" > /tmp/p2p_capabilities.json

          MISSING_CAPABILITIES="$(python3 - <<'PYEOF'
          import json

          with open('/tmp/p2p_capabilities.json') as source:
              payload = json.load(source)

          enabled = set()

          def visit(value):
              if isinstance(value, list):
                  for item in value:
                      visit(item)
                  return
              if not isinstance(value, dict):
                  return

              attributes = value.get('attributes')
              merged = dict(attributes) if isinstance(attributes, dict) else {}
              merged.update(value)
              capability = (
                  merged.get('capabilityType')
                  or merged.get('capability_type')
              )
              if isinstance(capability, str):
                  enabled.add(capability.upper().replace(' ', '_'))

              for child in value.values():
                  visit(child)

          visit(payload)
          required = {
              'Push Notifications': 'PUSH_NOTIFICATIONS',
              'HealthKit': 'HEALTHKIT',
          }
          for display_name, api_name in required.items():
              if api_name not in enabled:
                  print(display_name)
          PYEOF
          )"

          if [ -n "$MISSING_CAPABILITIES" ]; then
            while IFS= read -r capability; do
              [ -z "$capability" ] && continue
              echo "Enabling Apple capability: $capability"
              app-store-connect bundle-ids enable-capabilities \
                "$BUNDLE_RESOURCE_ID" \
                --capability "$capability" \
                "${ASC_AUTH_ARGS[@]}"
            done <<< "$MISSING_CAPABILITIES"
            echo "Waiting for Apple to invalidate stale profiles"
            sleep 10
          else
            echo "Push Notifications and HealthKit are already enabled"
          fi

          fetch_signing_files() {
            app-store-connect fetch-signing-files \
              "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key "@file:$CERTIFICATE_KEY" \
              --private-key @file:/tmp/api_key.pem \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --create \
              --verbose
          }

          set +e
          SIGNING_OUTPUT="$(fetch_signing_files 2>&1)"
          SIGNING_STATUS=$?
          set -e
          printf '%s\n' "$SIGNING_OUTPUT"

          if [ "$SIGNING_STATUS" -ne 0 ]; then
            echo "ERROR: Unable to create or fetch iOS signing files; no Apple certificates were deleted"
            exit "$SIGNING_STATUS"
          fi

          PROFILE_VALID=0
          while IFS= read -r profile_path; do
            if ! security cms -D -i "$profile_path" > /tmp/p2p_profile.plist 2>/dev/null; then
              continue
            fi
            PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/p2p_profile.plist 2>/dev/null || true)"
            case "$PROFILE_APP_ID" in
              *."$BUNDLE_ID") ;;
              *) continue ;;
            esac
            if /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/p2p_profile.plist >/dev/null 2>&1 \
              && [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.healthkit' /tmp/p2p_profile.plist 2>/dev/null || true)" = "true" ] \
              && /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.healthkit.access' /tmp/p2p_profile.plist >/dev/null 2>&1; then
              PROFILE_VALID=1
              echo "Verified provisioning profile includes Push Notifications and HealthKit"
              break
            fi
          done < <(
            find \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
              "$HOME/Library/MobileDevice/Provisioning Profiles" \
              -type f -name '*.mobileprovision' -print 2>/dev/null || true
          )

          if [ "$PROFILE_VALID" -ne 1 ]; then
            echo "ERROR: Generated provisioning profile is missing required Push Notifications or HealthKit entitlements"
            exit 1
          fi

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Set up Xcode code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Install Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          find . -name "Podfile" -not -path "./packages/*" -execdir pod install \;

      - name: Build iOS release IPA
        script: |
          set -euo pipefail

          echo "Resolving the current build number from App Store Connect"
          app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json \
            --silent \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            > /tmp/p2p_app_store_apps.json

          APP_STORE_APP_ID="$(python3 - "$BUNDLE_ID" <<'PYEOF'
          import json
          import sys

          wanted_bundle_id = sys.argv[1]
          with open('/tmp/p2p_app_store_apps.json') as source:
              payload = json.load(source)

          matches = {}

          def visit(value):
              if isinstance(value, list):
                  for item in value:
                      visit(item)
                  return
              if not isinstance(value, dict):
                  return

              attributes = value.get('attributes')
              merged = dict(attributes) if isinstance(attributes, dict) else {}
              merged.update(value)
              bundle_id = (
                  merged.get('bundleId')
                  or merged.get('bundle_id')
                  or merged.get('bundleIdIdentifier')
              )
              resource_id = (
                  merged.get('id')
                  or merged.get('resourceId')
                  or merged.get('resource_id')
              )
              if bundle_id == wanted_bundle_id and resource_id:
                  matches[str(resource_id)] = bundle_id

              for child in value.values():
                  visit(child)

          visit(payload)
          if len(matches) != 1:
              sys.exit(
                  f'ERROR: Expected one App Store app for {wanted_bundle_id}, '
                  f'found {len(matches)}'
              )
          print(next(iter(matches)))
          PYEOF
          )"

          # Build numbers restart for a new marketing version. Query only
          # version 5.1 so its first upload is build 1, then increment safely.
          set +e
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" \
            --pre-release-version 5.1 \
            --platform IOS \
            --silent \
            --private-key @file:/tmp/api_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID")"
          BUILD_LOOKUP_STATUS=$?
          set -e

          if [ "$BUILD_LOOKUP_STATUS" -ne 0 ] || [ -z "$LATEST_BUILD_NUMBER" ]; then
            echo "No TestFlight build exists for version 5.1; starting at build 1"
            LATEST_BUILD_NUMBER=0
          elif ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Apple returned an invalid 5.1 build number: $LATEST_BUILD_NUMBER"
            exit 1
          fi

          IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Apple latest 5.1 build is $LATEST_BUILD_NUMBER; building release 5.1 ($IOS_BUILD_NUMBER)"
          python3 scripts/verify_release_config.py --origin "$API_ORIGIN" --build "$IOS_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=5.1 \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=BUILD_NUMBER="$IOS_BUILD_NUMBER" \
            --dart-define=API_ORIGIN="$API_ORIGIN" \
            --dart-define=GIT_COMMIT="$(git rev-parse HEAD)"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/release-manifest.json
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

