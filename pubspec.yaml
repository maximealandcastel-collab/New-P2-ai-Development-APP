name: pler_to_pler_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.1.1+2

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  intl: ^0.20.2
  logger: ^2.6.2
  dotted_border: ^3.1.0
  file_picker: ^10.3.10
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  confetti: ^0.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.9.0
  connectivity_plus: ^7.1.1
  liquid_glass_renderer: ^0.2.0-dev.4
  lottie: ^3.3.3
  chat_bubbles: ^1.10.1
  image_cropper: ^12.2.1
  permission_handler: ^11.4.0
  flutter_blue_plus: ^2.3.9
  health: ^12.0.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  floating: ^6.0.0
  anam_flutter_sdk:
    path: packages/anam_flutter_sdk
  flutter_webrtc: ^0.12.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/core/utils/
  line_length: 80 # Optional (default: 80)
  integrations:
    flutter_svg: true
    lottie: true


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
